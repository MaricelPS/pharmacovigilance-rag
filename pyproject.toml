[project]
name = "pharmacovigilance-rag"
version = "0.1.0"
description = "Pharmacovigilance assistant over FAERS with LLM-powered analysis"
requires-python = ">=3.11"
dependencies = [
    # Data processing
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    # LLM and embeddings
    "anthropic>=0.40",
    "voyageai>=0.3",
    "instructor>=1.0",
    "pydantic>=2.0",
    # Analytics
    "scipy>=1.11",
    "numpy>=1.26",
    # Orchestration
    "prefect>=3.0",
    # UI
    "streamlit>=1.35",
    # Evaluation
    "ragas>=0.2",
    # Utilities
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]